<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #c0c1ff;
            box-shadow: 0 0 15px rgba(192, 193, 255, 0.2);
            outline: none;
        }
        .animated-blob-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #0b1326;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 {
            width: 300px;
            height: 300px;
            background: #8083ff;
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #00a572;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
            100% { transform: translate(-20px, 80px) scale(0.9); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen relative pb-24 font-body-lg">

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
</div>

</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tighter">Orbit</h1>
</div>
<button class="text-primary dark:text-primary-fixed-dim flex items-center justify-center p-2 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">dark_mode</span>
</button>
</header>
<main class="pt-24 px-4 max-w-lg mx-auto">
<!-- Date Selection -->
<section class="mb-stack-lg mt-stack-md">
<div class="flex items-center justify-between mb-stack-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Daily Journal</h2>
<span class="font-label-caps text-label-caps text-secondary-fixed bg-secondary-container/20 px-3 py-1 rounded-full border border-secondary/20">Today</span>
</div>
<div class="flex gap-3 overflow-x-auto pb-2 snap-x hide-scrollbar">
<!-- Previous Day -->
<button class="flex-shrink-0 snap-center w-16 h-20 glass-panel rounded-xl flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:scale-105 transition-transform">
<span class="font-label-caps text-label-caps opacity-70">TUE</span>
<span class="font-title-sm text-title-sm">23</span>
</button>
<!-- Current Day -->
<button class="flex-shrink-0 snap-center w-16 h-20 glass-panel border-primary/50 bg-primary/10 rounded-xl flex flex-col items-center justify-center gap-1 text-primary shadow-[0_0_15px_rgba(192,193,255,0.1)] scale-105 transition-transform">
<span class="font-label-caps text-label-caps">WED</span>
<span class="font-title-sm text-title-sm font-bold">24</span>
</button>
<!-- Next Day -->
<button class="flex-shrink-0 snap-center w-16 h-20 glass-panel rounded-xl flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:scale-105 transition-transform">
<span class="font-label-caps text-label-caps opacity-70">THU</span>
<span class="font-title-sm text-title-sm">25</span>
</button>
<!-- Future Day -->
<button class="flex-shrink-0 snap-center w-16 h-20 glass-panel rounded-xl flex flex-col items-center justify-center gap-1 text-on-surface-variant opacity-50 cursor-not-allowed">
<span class="font-label-caps text-label-caps opacity-70">FRI</span>
<span class="font-title-sm text-title-sm">26</span>
</button>
</div>
</section>
<!-- Editor Area -->
<section class="glass-panel rounded-2xl p-6 mb-stack-lg flex flex-col gap-4">
<input class="w-full bg-transparent border-none text-headline-md font-headline-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 p-0" placeholder="What's your main focus today?" type="text"/>
<div class="h-px w-full bg-white/5 my-2"></div>
<textarea class="w-full min-h-[200px] glass-input rounded-xl p-4 text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/40 resize-none" placeholder="Start typing your journal entry..."></textarea>
<div class="flex gap-2 mt-2">
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors hover:scale-105">
<span class="material-symbols-outlined">image</span>
</button>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors hover:scale-105">
<span class="material-symbols-outlined">mic</span>
</button>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors hover:scale-105">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
</div>
</section>

<button class="w-full bg-inverse-primary text-white font-title-sm text-title-sm py-4 rounded-xl shadow-[0_10px_20px_rgba(73,75,214,0.3)] hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(73,75,214,0.5)] transition-all duration-300 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>

        </button>
